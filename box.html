<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: red;
            width: 100px;
            height: 100px;
            border-radius: 0%;
            transition: border-radius 0.5s ease;
            position: fixed;
left: 45%;
top:20%;
         }
         .box:hover{
            border-radius: 50%;
         }
         .box2{
            width: 100px;
            height: 100px;
            background-color: orange;
        animation: box2 2s infinite alternate;
        position: fixed;
left: 30%;
top:20%;
         }
         @keyframes box2{
            from{
                transform: rotate(-45deg);
            }
            to{
                transform: rotate(45deg);
            }
         }
         .circle{
            width: 100px;
            height: 100px;
            background-color: green;
            border-radius: 50%;
            position: fixed;
left: 65%;
top:20%;
animation: grow 2s infinite alternate;
         }
@keyframes grow {
    from{
        width: 50px;
        height: 50px;
    }
    to{
        width: 150px;
        height: 150px;
    }
}
.icon{
    font-size: 50px;
    display: inline-block;
    animation: shake 0.4s 3;;
    width: 100px;
    height: 100px;
    background-color: yellow;
    border-radius: 50%;
    position: fixed;
left: 45%;
top:60%;
    
}
@keyframes shake{
    0%{
        transform: translateX(0);
    }
    25%{
        transform: translateX(-100px);
    }
    50%{
        transform: translateX(100px);

    }
    75%{
        transform: translateX(-100px);
    }
    100%{
        transform: translateX(0);
    }
}
         
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box2"></div>
    <div class="circle"></div>
    <div class="icon"></div>
</body>
</html>
