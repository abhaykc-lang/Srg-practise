<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slide to right</title>
    <style>
.slide{
    width: 100px;
    height: 100px;
    background-color: red;
    transition: transform 0.5s ease;

}
.slide:hover{
    transform: translateX(500px);
}
.box2{
    width: 100px;
    height: 100px;
    background-color: yellow;
    border-color: 2px solid black;
    transition: box2 0.5s, width 0.5s;
}
.box2:hover{
    width: 300px;
    background-color: blue;
    
}

    </style>
</head>
<body>
    <h1> slide to right </h1>
    <div class="slide"></div>
    <br> 
    <div class="box2"></div>
    <div class="rotate"><span style="display: inline-block; transition:transform 0.5s;"
        onmouseover="this.style.transform='rotate(180deg)'"
    onmouseout="this.style.transform='rotate(0deg)'">😀</span></div>
    
</body>
</html>
